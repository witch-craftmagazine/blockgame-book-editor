name: Deploy Studio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout editor
        uses: actions/checkout@v4
        with:
          path: blockgame-book-editor

      - name: Checkout viewer
        uses: actions/checkout@v4
        with:
          repository: witch-craftmagazine/blockgame-book-viewer
          path: blockgame-book-viewer

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build viewer library
        run: |
          cd blockgame-book-viewer
          bun install --frozen-lockfile
          bun run build:lib

      - name: Build editor app & test
        run: |
          cd blockgame-book-editor
          bun install
          bun run typecheck
          bun test
          bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './blockgame-book-editor/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
